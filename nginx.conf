# yahyrparedes.com — nginx (detrás de Coolify + Cloudflare)
# Mapa completo de URLs y redirecciones: docs/URLS.md

# Idioma por defecto para "/" según el navegador
map $http_accept_language $preferred_lang {
    default es;
    ~*^en   en;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Evita redirecciones absolutas a http://host:80/ detrás del proxy
    absolute_redirect off;
    port_in_redirect off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|woff|woff2|ttf|eot|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        expires 1M;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Raíz: idioma del navegador (302 para no cachear la elección) ──
    location = / {
        add_header Vary "Accept-Language" always;
        return 302 /$preferred_lang/;
    }

    # ── Redirecciones permanentes de URLs antiguas (evitan 404) ──
    rewrite ^/es/experience/?$                 /es/experiencia/ permanent;
    rewrite ^/es/stack/?$                      /es/perfil/ permanent;
    rewrite ^/en/stack/?$                      /en/profile/ permanent;
    rewrite ^/en/behind-the-engineer/?$        /en/about/ permanent;
    rewrite ^/en/(sobre-mi|perfil)/?$          /en/about/ permanent;
    rewrite ^/es/(about|behind-the-engineer)/?$ /es/sobre-mi/ permanent;
    rewrite ^/es/profile/?$                    /es/perfil/ permanent;
    rewrite ^/(es|en)/plugins/?$               /$1/open-source/ permanent;
    rewrite ^/(es|en)/plugins/(.+?)/?$         /$1/open-source/$2/ permanent;
    rewrite ^/es/services/?$                   /es/servicios/ permanent;
    rewrite ^/es/contact/?$                    /es/contacto/ permanent;
    rewrite ^/es/privacy/?$                    /es/privacidad/ permanent;
    rewrite ^/es/terms/?$                      /es/aviso-legal/ permanent;
    rewrite ^/es/services/(.+?)/?$             /es/servicios/$1/ permanent;
    rewrite ^/en/servicios/?$                  /en/services/ permanent;
    rewrite ^/en/servicios/(.+?)/?$            /en/services/$1/ permanent;
    rewrite ^/en/(contacto)/?$                 /en/contact/ permanent;
    rewrite ^/en/(privacidad)/?$               /en/privacy/ permanent;
    rewrite ^/en/(aviso-legal)/?$              /en/terms/ permanent;
    rewrite ^/en/experiencia/?$                /en/experience/ permanent;
    # URLs de la primera versión del sitio (sin prefijo de idioma)
    rewrite ^/(sobre-mi|perfil|servicios|contacto|blog|open-source|privacidad|aviso-legal|cookies|experiencia)/?$ /es/$1/ permanent;
    rewrite ^/(sobre-mi|perfil|servicios|contacto|blog|open-source|privacidad|aviso-legal|cookies|experiencia)(/.+?)/?$ /es/$1$2/ permanent;
    rewrite ^/stack/?$                         /es/perfil/ permanent;
    rewrite ^/plugins/?$                       /es/open-source/ permanent;
    rewrite ^/plugins(/.+?)/?$                 /es/open-source$1/ permanent;
    rewrite ^/(about|experience|services|contact|privacy|terms)/?$ /en/$1/ permanent;
    rewrite ^/(about|experience|services|contact|privacy|terms)(/.+?)/?$ /en/$1$2/ permanent;
    rewrite ^/(es|en)$                         /$1/ permanent;

    # ── Errores por idioma ──
    location /en/ {
        try_files $uri $uri/ =404;
        error_page 404 /en/404/index.html;
        error_page 500 502 503 504 /en/500/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;
    location = /404.html { internal; }
    location = /500.html { internal; }
    location ^~ /en/404/ { internal; }
    location ^~ /en/500/ { internal; }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ^~ /.well-known/ {
        allow all;
        try_files $uri =404;
    }
}
